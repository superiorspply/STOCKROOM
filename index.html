    msg.textContent = 'Point the camera at a label barcode.';
    if ('BarcodeDetector' in window){
      let det; try { det = new BarcodeDetector({formats:['code_39','code_128','ean_13','ean_8','upc_a','upc_e','qr_code']}); } catch(e){ det = new BarcodeDetector(); }
      const tick = async ()=>{
        if (stopped) return;
        try { const r = await det.detect(video); if (r && r[0] && r[0].rawValue && onCode(r[0].rawValue)) return; } catch(e){}
        timer = setTimeout(tick, 250);
      };
      tick();
    } else {
      try {
        const ZX = await loadZxing(); if (stopped) return;
        const hints = new Map();
        hints.set(ZX.DecodeHintType.POSSIBLE_FORMATS, [ZX.BarcodeFormat.CODE_39, ZX.BarcodeFormat.CODE_128, ZX.BarcodeFormat.EAN_13, ZX.BarcodeFormat.QR_CODE]);
        hints.set(ZX.DecodeHintType.TRY_HARDER, true);
        reader = new ZX.BrowserMultiFormatReader(hints, 300);
        reader.decodeFromVideoElement(video, res=>{ if (res && !stopped) onCode(res.getText()); });
      } catch(e){ msg.textContent = 'Could not load the scanner. Use the photo button or type the SKU.'; }
    }
  }
  openSheet('Scan a label', h('div',{}, video, msg, h('div',{class:'foot',style:'flex-direction:column;margin-bottom:12px'}, photoBtn, photoIn), h('div',{class:'lbl'},'Or type or scan a SKU'), form), {noFocus:true});
  onSheetClose = stop;

const HPERIODS = [['1','1D'],['7','7D'],['30','30D'],['90','90D'],['365','1Y'],['all','All']];
const HMETRICS = [['revenue','Revenue'],['profit','Profit'],['units','Units'],['orders','Orders']];
const DAY = 864e5;
function metricVal(sales, m){
  if (m==='orders') return new Set(sales.map(invKey)).size;
  let v = 0;
  for (const s of sales){ v += m==='units' ? (s.qty||0) : m==='profit' ? (s.total||0)-(s.unitCost||0)*(s.qty||0) : (s.total||0); }
  return (m==='revenue' || m==='profit') ? round2(v) : v;
}
const metricFmt = (m,v) => (m==='revenue' || m==='profit') ? (v<0 ? '-' : '')+money(Math.abs(v)) : fmtN(v);
const compact = (m,v) => { const p = (m==='revenue' || m==='profit') ? '$' : ''; const a = Math.abs(v); return p+(a>=1000 ? (a/1000).toFixed(a>=10000 ? 0 : 1).replace(/\.0$/,'')+'k' : String(a>=10 ? Math.round(a) : Math.round(a*10)/10)); };
function goTab(tab, patch){ Object.assign(state, patch||{}); state.tab = tab; renderTab(); window.scrollTo(0,0); }
function dayStart(d){ const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); }
function homeRange(){
  const end = dayStart(Date.now()) + DAY;
  if (state.hperiod==='all'){
    let first = Date.now(); for (const s of state.sales){ const t = new Date(s.at).getTime(); if (t<first) first = t; }
    return {start:Math.min(dayStart(first), end-7*DAY), end};
  }
  return {start:end - int(state.hperiod)*DAY, end};
}
const HOUR = 36e5;
function buildSeries(sales, start, end, metric){
  if (end-start <= DAY+HOUR){
    const b = []; for (let i=0;i<24;i++) b.push({t:start+i*HOUR, list:[]});
    for (const s of sales){ const t = new Date(s.at).getTime(); if (t<start || t>=start+DAY) continue; b[Math.min(23, Math.floor((t-start)/HOUR))].list.push(s); }
    return {step:'hour', pts:b.map(x=>({t:x.t, v:metricVal(x.list, metric)}))};
  }
  const span = Math.max(1, Math.round((end-start)/DAY));
  const step = span<=120 ? 1 : span<=400 ? 7 : 30;
  const n = Math.ceil(span/step); const b = []; for (let i=0;i<n;i++) b.push({t:start+i*step*DAY, list:[]});
  for (const s of sales){ const t = new Date(s.at).getTime(); if (t<start || t>=end) continue; b[Math.min(n-1, Math.floor((t-start)/(step*DAY)))].list.push(s); }
  return {step, pts:b.map(x=>({t:x.t, v:metricVal(x.list, metric)}))};
}
const hrLabel = t => new Date(t).toLocaleTimeString([], {hour:'numeric'});
function lineChart(pts, metric, color, onMove, W, H, hourly){
  W = W || 340; H = H || 176; const PL = 8, PR = 8, PT = 16, PB = 22;
  const max = Math.max(0, ...pts.map(p=>p.v)); const top = max>0 ? max*1.12 : 1;
  const x = i => pts.length===1 ? W/2 : PL+(W-PL-PR)*i/(pts.length-1);
  const y = v => PT+(H-PT-PB)*(1-Math.max(0,v)/top);

  const input = h('textarea',{class:'askin',rows:'1',placeholder:'Ask about sales, stock, customers, payments…','aria-label':'Your question'});

    h('p',{class:'hint',style:'margin:0 0 8px'},'Ask in plain words. Answers come from your live records and use your own Claude allowance.'),
    msgs, sugg,
    h('div',{class:'askbar'}, input, sendBtn, stopBtn),
    h('div',{style:'text-align:right'}, clear)), {noFocus:true});

}

function statementData(c, mode){
  const all = allInvoices().filter(v=>v.customerId===c.id).sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  const list = mode==='open' ? all.filter(v=>v.balance>0.004) : all;
  const pays = []; list.forEach(v=>v.payments.forEach(p=>pays.push({at:p.at, method:p.method, no:v.no, amount:num(p.amount)})));
  pays.sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  return {c, mode, list, pays, total:round2(list.reduce((a,v)=>a+v.total,0)), paid:round2(list.reduce((a,v)=>a+v.paidAmt,0)), balance:round2(list.reduce((a,v)=>a+v.balance,0)), date:nowIso()};
}

const styleNorm = v => String(v||'').toUpperCase().replace(/\s+/g,'').trim();
function stockxErr(code, extra){ const e = new Error(extra||code); e.code = code; return e; }
async function stockxLookup(style, size){
  const S = state.stockx || {}; if (!S.token) throw stockxErr('no_token');
  const hd = {'Authorization':'Bearer '+S.token, 'Accept':'application/json'}; if (S.apiKey) hd['x-api-key'] = S.apiKey;
  const get = async path => {
    let r; try { r = await fetch('https://api.stockx.com'+path, {headers:hd}); } catch(e){ throw stockxErr('blocked'); }
    if (r.status===401 || r.status===403) throw stockxErr('auth');
    if (!r.ok) throw stockxErr('http', 'StockX answered '+r.status);
    return r.json();
  };
  const s = await get('/v2/catalog/search?query='+encodeURIComponent(style)+'&pageNumber=1&pageSize=5');
  const prods = s.products || s.data || []; const p = prods.find(x=>styleNorm(x.styleId)===styleNorm(style)) || prods[0];
  if (!p) throw stockxErr('nomatch');
  const out = {title:p.title||p.name||style, url:p.urlKey ? 'https://stockx.com/'+p.urlKey : 'https://stockx.com/search?s='+encodeURIComponent(style), ask:null, bid:null, size:'', image:(p.media&&(p.media.imageUrl||p.media.thumbUrl))||p.imageUrl||p.image||(p.urlKey ? 'https://images.stockx.com/images/'+String(p.urlKey).split('-').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join('-')+'.jpg?fit=fill&bg=FFFFFF&w=700&h=500&auto=compress&q=90&trim=color' : '')};
  if (!size) return out;
  const vs = await get('/v2/catalog/products/'+p.productId+'/variants'); const arr = Array.isArray(vs) ? vs : (vs.variants||[]);
  const digits = x => String(x||'').replace(/[^0-9.]/g,'');
  const v = arr.find(x=>String(x.variantValue||'').toLowerCase()===String(size).toLowerCase()) || arr.find(x=>digits(x.variantValue)===digits(size));
  if (!v) throw stockxErr('nosize');
  const md = await get('/v2/catalog/products/'+p.productId+'/variants/'+v.variantId+'/market-data?currencyCode=USD');
  out.ask = num(md.lowestAskAmount)||null; out.bid = num(md.highestBidAmount)||null; out.size = v.variantValue||size; return out;
}

const needsSetup = i => i.source==='invoice' && (!i.photoId || !(i.price>0));
const setupLabel = i => !i.photoId && !(i.price>0) ? 'Needs photo & price' : !i.photoId ? 'Needs photo' : 'Needs price';
const avgCost = (cur, n, c)=>{ const onHand = Math.max(0, cur.qty||0); const t = onHand + n; return t>0 ? round4((onHand*(cur.cost||0) + n*c)/t) : round4(c); };
const words = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(w=>w.length>1);
function matchItem(name, code){
  const c = cleanSku(code||'');
  if (c){ const hit = state.items.find(i=>cleanSku(i.sku)===c || (i.styleCode && cleanSku(i.styleCode)===c)); if (hit) return hit; }
  const a = new Set(words(name)); if (!a.size) return null;
  let best = null, score = 0;
  for (const it of state.items){
    const b = new Set(words(it.name)); if (!b.size) continue;
    let both = 0; a.forEach(w=>{ if (b.has(w)) both++; });
    const s = both / (a.size + b.size - both);
    if (s > score){ score = s; best = it; }
  }
  return score >= 0.5 ? best : null;
}

function parseCsv(text){
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [',',';','\t'].sort((a,b)=>first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch==='"'){ if (text[i+1]==='"'){ cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if (ch==='"') q = true;
    else if (ch===delim){ row.push(cell); cell = ''; }
    else if (ch==='\n' || ch==='\r'){ if (ch==='\r' && text[i+1]==='\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows.map(r=>r.map(c=>c.trim()));
}
function loadXlsx(){
  return new Promise((res, rej)=>{
    if (window.XLSX) return res();
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ()=>res(); s.onerror = ()=>rej(new Error('Could not load the Excel reader. Check your connection, or save the file as CSV.'));
    document.head.append(s);
  });
}
async function readSheetFile(f){
  if (/\.xlsx?$/i.test(f.name)){
    await loadXlsx();
    const wb = window.XLSX.read(await f.arrayBuffer(), {type:'array'});
    return window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''}).map(r=>r.map(c=>String(c).trim()));
  }
  return parseCsv(await f.text());
}
function openColumnMap(rows, fname){
  const looks = {
    name:/desc|product|item name|^item$|^name$|title|article/i,
    qty:/qty|quant|units?$|count|pcs|ordered|shipped|received/i,
    cost:/unit.?(cost|price)|^cost|^price|each|rate|wholesale/i,

  Object.values(S).forEach(s=>s.addEventListener('change', showPrev)); showPrev();
  openSheet('Match the columns', h('div',{},
    h('p',{class:'hint',style:'margin:0 0 12px'}, fname+' · '+data.length+' rows. Pick which column holds each detail.'),
    field('Product name', S.name), field('Quantity', S.qty), field('Cost each', S.cost, 'Leave as (none) if the file only has line totals.'), field('Line total', S.total), field('Supplier code or SKU', S.code, 'Optional. Used to match items you already have.'),
    preview, err,
    h('div',{class:'foot'}, h('button',{class:'btn',type:'button',onclick:openBringIn},'Back'), h('button',{class:'btn primary',type:'button',onclick:()=>{ const l = build(); if (!l.length){ err.textContent = 'Pick the name and quantity columns first.'; return; } openInvoiceReview({supplier:'', invoice_number:'', invoice_date:'', lines:l, warning:''}, 'spreadsheet'); }},'Review lines'))), {noFocus:true});
}

    recent.forEach(v=>invSel.append(h('option',{value:v.key}, invNumber(v.key)+' · '+fmtDate(v.at)+' · '+money(v.total))));

  const form = h('form',{novalidate:true},

    e.preventDefault(); err.textContent = '';

    if (sn && q > (curMap[szKey]||0)){ err.textContent = 'Only '+(curMap[szKey]||0)+' left in size '+szKey+'.'; return; }

    btn.disabled = true;
    const ok = await write(async()=>{
      let customerId = null, customerName = '';
      if (sel.value==='__new'){
        const cref = state.db.collection('customers').doc();
        customerName = newName.value.trim();
        await cref.set({name:customerName, type:newType.value, handle:newHandle.value.trim(), phone:'', email:'', addresses:[], address:'', notes:'', createdAt:nowIso()});
        customerId = cref.id;
      } else if (sel.value){
        customerId = sel.value; const c = state.customers.find(x=>x.id===customerId); customerName = c ? c.name : '';
      }
      invNo = (customerId && sel.value!=='__new' && invSel.value && invSel.value!=='__new') ? invSel.value : nextInvoiceNo();
      const baseSpent = (customerId && sel.value!=='__new') ? spentBy(customerId) : 0;
      const left = (cur.qty||0) - q;
      await state.db.collection('sales').doc().set({itemId:id, sku:cur.sku, name:cur.name, qty:q, size:(sn && szKey!=='Unsized') ? szKey : '', sizeType:(sn && szKey!=='Unsized') ? (cur.sizeType||'') : '', unitPrice:p, unitCost:cur.cost||0, total:round2(q*p), customerId, customerName, invoiceNo:invNo, note:note.value.trim(), at:nowIso()});
      const itemUpd = {qty:left, queued:left>0 ? !!cur.queued : false, updatedAt:nowIso()};
      if (sn){ curMap[szKey] = (curMap[szKey]||0)-q; if (curMap[szKey]<=0) delete curMap[szKey]; itemUpd.sizes = curMap; }
      await state.db.doc('items/'+id).update(itemUpd);
      if (customerId && state.settingsSaved) await state.db.doc('customers/'+customerId).update({bracket:bracketOf(baseSpent+round2(q*p), state.settings.medium, state.settings.large)});
    });
    if (ok){ const hasCust = !!sel.value; closeSheet(); toast('Sold '+q+' × '+cur.sku+(sn && szKey!=='Unsized' ? ' size '+szKey : '')+' for '+money(q*p)); if (hasCust) setTimeout(()=>openInvoice(invNo), 250); } else btn.disabled = false;
  });
  openSheet('Sell item', form);
}

function csvCell(v){
  let s = v==null ? '' : String(v);
  if (typeof v==='string' && /^[=+@\-]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
const toCsv = rows => rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
async function saveCsv(filename, rows){
  if (!state.dl) return;
  try { await state.dl.save({filename, data: toCsv(rows)}); }
  catch(e){ if (!e || e.code!=='declined') toast('Could not save the file.'); }
}

function renderInventory(){

  const nSetup = items.filter(needsSetup).length; if (nSetup) chips.push(['setup','Needs photo & price',nSetup]);
  host.append(h('div',{class:'chips'}, chips.map(([k,l,n])=>h('button',{class:'chip',type:'button','aria-pressed':String(state.filter===k),onclick:()=>{ state.filter = k; renderList(); }}, l+' '+n))));
  if (items.some(isSneaker)){

    }

  const q = state.q.trim().toLowerCase();

    if (state.cat!=='all' && catKey(i.category)!==state.cat) return false;

    host.append(h('p',{class:'empty'}, items.length ? 'No items match.' : 'No items yet. Tap Receive item to add your first one and get its SKU.'));

const lsGet = (k,d)=>{ try { const v = localStorage.getItem(k); return v==null ? d : v; } catch(e){ return d; } };
const lsSet = (k,v)=>{ try { localStorage.setItem(k, v); } catch(e){} };

  region:null, interval:int(lsGet('ss_liveint','3'))||3, thumbs:{}, note:'', sigNow:null, sigDone:null, pending:false,

const liveShow = ()=>{ const L = state.live; if (!L.show){ L.show = new Date().toISOString().slice(0,16); lsSet('ss_liveshow', L.show); } return L.show; };
const showLabel = id => { const d = new Date(id+':00Z'); return isNaN(d) ? id : d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); };
const liveId = (show, lot) => 'L'+show.replace(/[^0-9]/g,'')+'_'+lot;
const liveCur = () => state.live.entries.filter(e=>e.show===liveShow());
const liveStatusText = e => e.status==='dismissed' ? 'Dismissed' : e.status==='ready' ? 'Logged' : 'Check';
function livePing(){ const L = state.live; if (L.refresh) { const a = document.activeElement; const box = L.listBox; if (a && box && box.contains(a) && /^(INPUT|SELECT)$/.test(a.tagName)){ clearTimeout(L.deferT); L.deferT = setTimeout(livePing, 1500); return; } L.refresh(); } updateLiveBtn(); }
function updateLiveBtn(){ const b = $('#liveBtn'); if (!b) return; const L = state.live; b.classList.toggle('on', L.running); b.textContent = L.running ? 'Live ●' : 'Live'; }
function liveItemOf(e){ return e.itemId ? state.items.find(i=>i.id===e.itemId) : null; }
function liveReadyCheck(e){ return !!liveItemOf(e) && e.price>=0 && e.qty>=1; }

/* save an entry (deterministic id so the same number is never written twice) */
async function liveAddEntry(raw, thumb){
  const L = state.live; const show = raw.show || liveShow(); const lot = int(raw.lot); if (lot<1) return null;
  const id = liveId(show, lot);
  const ex = L.entries.find(e=>e.id===id);
  if (L.seen.has(id) || ex){
    if (ex && raw.fromScreen && ((raw.price!=null && Math.abs(num(raw.price)-ex.price)>0.005) && raw.buyer && ex.buyer && raw.buyer.toLowerCase()!==ex.buyer.toLowerCase())){
      L.note = 'Number #'+lot+' showed up again with a different price and buyer. If the numbers started over, tap Start new show.'; livePing();
    }
    return null;
  }
  L.seen.add(id);
  const it = state.items.find(i=>i.sku && raw.sku && i.sku.toLowerCase()===String(raw.sku).trim().toLowerCase()) || null;
  const cases = Math.max(0, int(raw.cases)||0);
  const loose = raw.qty==null || raw.qty==='' ? (cases>0 ? 0 : 1) : Math.max(0, int(raw.qty)||0);
  const per = it && it.caseQty>1 ? int(it.caseQty) : (int(raw.upc)>1 ? int(raw.upc) : 0);
  const caseUnknown = cases>0 && !per;
  const e = {show, lot, price:round2(num(raw.price)), qty:Math.max(1, loose + (cases>0 ? cases*(per||1) : 0)), cases, perCase:per, note:caseUnknown ? 'This looks like a full case but the units per case are not known. Set the quantity.' : '', buyer:String(raw.buyer||'').replace(/^@/,'').trim().slice(0,60), product:String(raw.product||'').trim().slice(0,160),
    sku:it ? it.sku : '', itemId:it ? it.id : '', conf:['high','medium','low'].includes(raw.confidence) ? raw.confidence : 'low', status:'review', manual:!!raw.manual, at:raw.at || nowIso()};
  e.status = (e.conf==='high' && liveReadyCheck(e) && !caseUnknown) ? 'ready' : 'review';
  if (raw.manual && liveReadyCheck(e)) e.status = 'ready';
  if (thumb) L.thumbs[id] = thumb;
  L.entries.push(Object.assign({id}, e));
  livePing();
  const ok = await write(()=>state.db.doc('livelog/'+id).set(e));
  if (!ok){ L.entries = L.entries.filter(x=>x.id!==id); L.seen.delete(id); livePing(); return null; }
  return id;
}
async function liveUpdate(id, patch){
  const L = state.live; const e = L.entries.find(x=>x.id===id); if (!e) return;
  Object.assign(e, patch);
  livePing();
  await write(()=>state.db.doc('livelog/'+id).update(Object.assign({}, patch, {status:e.status})));
}

function liveSig(canvasCtx, sx, sy, sw, sh){

    });
  }},'Delete show');
  const newShowBtn = h('button',{class:'linkbtn',type:'button',onclick:()=>{ confirmSheet('Start a new show?','Use this when the item numbers start over from 1. Sales already logged stay saved under their own show.','Start new show', async()=>{ L.show = new Date().toISOString().slice(0,16); lsSet('ss_liveshow', L.show); L.sigDone = null; L.note = ''; setTimeout(openLive, 50); return true; }); }},'Start new show');
  openSheet('Watch live', h('div',{},
    h('p',{class:'hint',style:'margin:0 0 10px'},'Share the window that shows your live. The app reads the item number and sold price when a new sale appears and logs it here. This log is kept separate from your regular sales and stock. Keep this tab open while the show runs.'),
    h('div',{style:'display:flex;gap:8px;flex-wrap:wrap;align-items:center'}, startBtn, regionBtn, shotBtn, fileIn),
    prevWrap, regionHint, h('div',{style:'margin-top:10px'}, field('Check the screen', intSel)),
    status, h('div',{class:'lvshow'}, showSel), h('div',{class:'lvshow',style:'justify-content:flex-start;gap:14px'}, newShowBtn, exportBtn, delBtn), sumBox, missBox, listBox, manual), {noFocus:true});
  const pvT = setInterval(()=>{ if (L.running && L.video && L.video.videoWidth){ const had = !!lastCap; const cap = liveCapture(); if (cap){ paint(cap); if (!had) drawCtl(); } } }, 600);
  onSheetClose = ()=>{ clearInterval(pvT); L.refresh = null; L.drawPrev = null; L.listBox = null; };
  drawCtl(); refresh();
  if (L.running && L.video && L.video.videoWidth){ const cap = liveCapture(); if (cap) paint(cap); }
  const old = L.refresh; L.refresh = ()=>{ drawCtl(); old(); };
}

/* ---------- start ---------- */
renderStatus(); renderTab();

(async function init(){
  try {
    if (!window.claude || !claude.use) throw new Error('no runtime');
    const [db, user, dl, assets, sample] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads'), claude.use('assets'), null]);
    state.dl = dl; state.assets = assets; state.sample = sample || null;
    try { state.isAdmin = user ? ((await user.isOwner()) || (await user.canEdit())) : true; } catch(e){ state.isAdmin = true; }
    if (dl && state.isAdmin) $('#exportBtn').hidden = false;
    if (state.sample && state.isAdmin) $('#askBtn').hidden = false;
    if (state.sample && state.isAdmin) $('#liveBtn').hidden = false;
    renderStatus(); renderTab();
    if (!db){ state.status = 'offline'; renderStatus(); setBanner('Could not connect to your data, so nothing you enter will be kept. Check your connection and reload the page.'); renderList(); return; }
    state.db = db;
    loadCart(); if (state.cart.lines.length || state.cart.cid) drawCart();
    // TikTok Shop shows in Reports only for companies support has switched it on for.
    if (state.isAdmin) window.claude.use('tiktok').then(tt=>tt.status()).then(st=>{ state.tiktokOn = st.enabled; if (state.tab==='reports') renderTab(); }).catch(()=>{});
    window.claude.use('tiktok').then(async tt=>{
      const p = tt.pending(); if (!p) return;
      toast('Connecting TikTok Shop…');
      try { const r = await tt.finish(p); toast('Connected '+(r.shop_name || 'TikTok Shop')); state.tiktokOn = true; goTab('reports', {rview:'tiktok'}); }
      catch(e){ setBanner('TikTok Shop did not connect: '+e.message); }
    }).catch(()=>{});
    try { const can = user ? await user.can('data.write') : null; if (can===false){ state.canWrite = false; setBanner('You have view-only access. You can look at the data but not change it.'); } } catch(e){}
    state.status = 'live'; renderStatus();
    subscribe();
  } catch(e){
    state.status = 'offline'; renderStatus();
    setBanner('Could not connect to your data, so nothing you enter will be kept. Check your connection and reload the page.');
    renderList();
  }
})();
})();
</script>
