name: Test and publish site

# Every change to main is checked, then published to GitHub Pages.
# Pull requests are checked but not published.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Database security tests
        env:
          DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres
        run: sh supabase/tests/run.sh
      - name: JavaScript syntax
        run: |
          node --check js/backend.js
          node --check config.js
          python3 - <<'EOF'
          import re, subprocess, tempfile
          html = open('index.html').read()
          for i, js in enumerate(re.findall(r'<script>(.*?)</script>', html, re.S)):
              f = tempfile.NamedTemporaryFile('w', suffix='.js', delete=False); f.write(js); f.close()
              subprocess.run(['node', '--check', f.name], check=True)
          print('index.html scripts OK')
          EOF

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html config.js manifest.webmanifest _site/
          cp -r js icons _site/
          touch _site/.nojekyll
          # Stamp script and icon links with this commit so phones load each update right away
          # instead of reusing an older cached copy.
          V="${GITHUB_SHA::8}"
          sed -i -e "s#src=\"config.js\"#src=\"config.js?v=$V\"#" \
                 -e "s#src=\"js/backend.js\"#src=\"js/backend.js?v=$V\"#" \
                 -e "s#href=\"icons/\([^\"]*\)\"#href=\"icons/\1?v=$V\"#g" \
                 -e "s#href=\"manifest.webmanifest\"#href=\"manifest.webmanifest?v=$V\"#" _site/index.html
          sed -i "s#'icons/icon.svg'#'icons/icon.svg?v=$V'#" _site/js/backend.js
          grep -q "js/backend.js?v=$V" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
