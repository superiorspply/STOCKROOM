<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a58"/>
      <stop offset="1" stop-color="#8f0c18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#3a0006" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g filter="url(#shadow)" stroke-linejoin="round" stroke-width="14" transform="translate(256 267) scale(1.14) translate(-256 -267)">
    <!-- top, left and right faces of a box -->
    <path d="M256 116 402 190 256 264 110 190Z" fill="#ffffff" stroke="#ffffff"/>
    <path d="M110 190 256 264 256 418 110 344Z" fill="#f1e4e6" stroke="#f1e4e6"/>
    <path d="M256 264 402 190 402 344 256 418Z" fill="#dcc6c9" stroke="#dcc6c9"/>
    <!-- packing tape across the top and down the front edge -->
    <path d="M172 159 196 147 342 221 318 233Z" fill="#e5192b" stroke="#e5192b" stroke-width="2"/>
    <path d="M318 233 342 221 342 280 318 292Z" fill="#b8101f" stroke="#b8101f" stroke-width="2"/>
  </g>
</svg>
